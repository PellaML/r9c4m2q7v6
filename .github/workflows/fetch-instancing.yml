name: Owned native instance observations
run-name: Bounded distinct-row instance observations
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact Main-approved source commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: owned-native-instance-observations
  cancel-in-progress: false
jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'PellaML/r9c4m2q7v6' && github.ref == 'refs/heads/research/probe' && github.run_attempt == '1' && github.sha == inputs.expected_head
    strategy:
      fail-fast: false
      matrix:
        label: [macos-26, xcode-27]
    runs-on: ${{ matrix.label }}
    timeout-minutes: 15
    env:
      EXPECTED_HEAD: ${{ inputs.expected_head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Acquire owned rows and deliberate wrong-instance controls
        timeout-minutes: 8
        shell: bash
        run: bash scripts/fetch-edge/instancing.sh out-fetch-instancing
      - name: Enforce closed artifact allowlist and budget
        if: always()
        id: bounds
        shell: bash
        run: |
          bash scripts/fetch-edge/instancing.sh --check-artifacts out-fetch-instancing
          echo 'bounded=true' >> "$GITHUB_OUTPUT"
      - name: Retain all bounded raw bytes, including failures
        if: ${{ always() && steps.bounds.outputs.bounded == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fetch-instancing-${{ matrix.label }}
          retention-days: 3
          if-no-files-found: error
          path: out-fetch-instancing/results/
