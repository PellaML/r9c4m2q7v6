name: Bounded single-channel render observations
on:
  workflow_dispatch:
    inputs:
      main_reviewed:
        description: Main reviewed exactly this generic source subset
        type: boolean
        required: true
        default: false
      reviewed_commit:
        description: Full reviewed commit SHA, equal to the run commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: bounded-r16f-render
  cancel-in-progress: false
jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' && inputs.main_reviewed == true && inputs.reviewed_commit == github.sha && github.repository == 'PellaML/r9c4m2q7v6' && github.ref == 'refs/heads/research/probe' && github.run_attempt == '1'
    runs-on: xcode-27
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Inspect loaded AIR and collect bounded native observations
        id: observe
        env:
          RUNNER_LABEL: xcode-27
          EXPECTED_OS_BUILD: 26A434
        run: |
          [[ ! -e out-r16f-render && ! -L out-r16f-render ]] || exit 1
          echo 'fresh=true' >> "$GITHUB_OUTPUT"
          bash scripts/r16f-render/run.sh
      - name: Verify artifact allowlist, hashes and size bounds
        id: bounds
        if: ${{ always() && steps.observe.outputs.fresh == 'true' }}
        run: |
          bash scripts/r16f-render/run.sh verify
          echo 'bounded=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && steps.bounds.outputs.bounded == 'true' }}
        with:
          name: r16f-render-xcode-27-26A434-precise
          retention-days: 3
          if-no-files-found: error
          path: |
            out-r16f-render/sha256.txt
            out-r16f-render/results/
