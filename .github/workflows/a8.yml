name: Generic alpha UNORM observation
run-name: Alpha UNORM Managed storage and sampling
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: generic-a8-observation
  cancel-in-progress: false
jobs:
  a8:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == '1'
    strategy:
      fail-fast: false
      matrix:
        label: [macos-26, xcode-27]
    runs-on: ${{ matrix.label }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Observe
        id: observe
        shell: bash
        run: |
          [[ ! -e out-a8 && ! -L out-a8 ]] || exit 1
          echo 'fresh=true' >> "$GITHUB_OUTPUT"
          bash scripts/a8/run.sh
      - name: Enforce artifact budget
        if: ${{ always() && steps.observe.outputs.fresh == 'true' }}
        id: bounds
        shell: bash
        run: |
          shopt -s nullglob
          [[ -d out-a8/results && ! -L out-a8 && ! -L out-a8/results ]] || exit 1
          [[ -z "$(find out-a8 ! -type f ! -type d -print -quit)" ]] || exit 1
          [[ -z "$(find out-a8 -mindepth 1 -type d ! -path out-a8/results -print -quit)" ]] || exit 1
          files=(out-a8/command-exit.json out-a8/run-receipt.txt out-a8/source-sha256.txt out-a8/sha256.txt
                 out-a8/results/*.json out-a8/results/*.bin out-a8/results/*.txt)
          total=0; count=0
          for file in "${files[@]}"; do
            [[ -f "$file" && ! -L "$file" ]] || exit 1
            size=$(wc -c < "$file"); (( size <= 1048576 )) || exit 1
            total=$((total + size)); count=$((count + 1))
          done
          actual=$(find out-a8 -type f | wc -l)
          (( count == actual && count >= 5 && count <= 224 && total <= 8388608 )) || exit 1
          (cd out-a8 && shasum -a 256 -c sha256.txt > /dev/null)
          echo 'bounded=true' >> "$GITHUB_OUTPUT"
      - name: Retain
        if: ${{ always() && steps.bounds.outputs.bounded == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: a8-${{ matrix.label }}
          retention-days: 3
          if-no-files-found: error
          path: |
            out-a8/command-exit.json
            out-a8/run-receipt.txt
            out-a8/source-sha256.txt
            out-a8/sha256.txt
            out-a8/results/*.json
            out-a8/results/*.bin
            out-a8/results/*.txt
