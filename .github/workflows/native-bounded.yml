name: Bounded native Metal API observations
on:
  workflow_dispatch:
    inputs:
      main_reviewed:
        description: Main has reviewed the exact public source subset
        type: boolean
        required: true
        default: false
      reviewed_commit:
        description: Full commit SHA reviewed by Main; must equal this run commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: bounded-native-metal-observations
  cancel-in-progress: false
jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' && inputs.main_reviewed == true && inputs.reviewed_commit == github.sha && github.repository == 'PellaML/r9c4m2q7v6' && github.ref == 'refs/heads/research/probe' && github.run_attempt == '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-26
            os_build: 25G332
          - label: xcode-27
            os_build: 26A434
    runs-on: ${{ matrix.label }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Compile and observe exact native bytes
        id: observe
        shell: bash
        env:
          RUNNER_LABEL: ${{ matrix.label }}
          EXPECTED_OS_BUILD: ${{ matrix.os_build }}
        run: |
          [[ ! -e out-native-bounded && ! -L out-native-bounded ]] || exit 1
          echo 'fresh=true' >> "$GITHUB_OUTPUT"
          bash scripts/native-bounded/run.sh
      - name: Verify exact output allowlist, bounds and pins
        id: bounds
        if: ${{ always() && steps.observe.outputs.fresh == 'true' }}
        shell: bash
        run: |
          python3 -B scripts/native-bounded/runner.py verify
          echo 'bounded=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && steps.bounds.outputs.bounded == 'true' }}
        with:
          name: native-bounded-${{ matrix.label }}-${{ matrix.os_build }}
          retention-days: 3
          if-no-files-found: error
          path: |
            out-native-bounded/metadata.json
            out-native-bounded/source-sha256.json
            out-native-bounded/commands.json
            out-native-bounded/run-status.json
            out-native-bounded/toolchain.txt
            out-native-bounded/build.txt
            out-native-bounded/self-test.txt
            out-native-bounded/validation.txt
            out-native-bounded/cases.json
            out-native-bounded/q1-patterns.bin
            out-native-bounded/q2-source.bin
            out-native-bounded/q2-seed.bin
            out-native-bounded/probe.air
            out-native-bounded/probe.metallib
            out-native-bounded/compile-pair.json
            out-native-bounded/validation.json
            out-native-bounded/q2-models.tsv
            out-native-bounded/q1-shared.json
            out-native-bounded/q1-shared.gpu.bin
            out-native-bounded/q1-shared.txt
            out-native-bounded/q1-managed.json
            out-native-bounded/q1-managed.gpu.bin
            out-native-bounded/q1-managed.txt
            out-native-bounded/q1-private.json
            out-native-bounded/q1-private.gpu.bin
            out-native-bounded/q1-private.txt
            out-native-bounded/q2.json
            out-native-bounded/q2.gpu.bin
            out-native-bounded/q2.txt
            out-native-bounded/pins.json
            out-native-bounded/pins.sha256
