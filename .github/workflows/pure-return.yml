name: Pure return artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Compile
        shell: bash
        run: bash scripts/compile-pure-return.sh
      - name: Record
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pure-return-air
          retention-days: 7
          if-no-files-found: error
          path: |
            out-pure-return/manifest.json
            out-pure-return/shaders/texture3d-metal31.air
            out-pure-return/shaders/texture3d-metal31.metallib
            out-pure-return/shaders/texture3d-metal41.air
            out-pure-return/shaders/texture3d-metal41.metallib
