name: Probe

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Standard runner image
        type: choice
        required: true
        default: macos-26
        options:
          - macos-26
          - xcode-27

permissions:
  contents: read

jobs:
  probe:
    # Only the two standard labels are possible; no paid size suffix is accepted.
    runs-on: ${{ inputs.runner_label == 'xcode-27' && 'xcode-27' || 'macos-26' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Run
        shell: bash
        run: bash scripts/run.sh out
      - name: Record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: observations-${{ inputs.runner_label }}
          retention-days: 7
          if-no-files-found: error
          path: |
            out/manifest.json
            out/coordinates.bin
            out/samples.bin
            out/anchors.bin
            out/invalid-control.json
            out/shaders/*.air
            out/shaders/*.metallib
