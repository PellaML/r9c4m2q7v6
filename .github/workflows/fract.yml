name: Fractional ALU probe
run-name: Fractional ALU (${{ inputs.runner_label }}, fast)

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Standard Apple Silicon runner image
        type: choice
        required: true
        default: macos-26
        options:
          - macos-26
          - xcode-27

permissions:
  contents: read

jobs:
  fract:
    runs-on: ${{ inputs.runner_label == 'xcode-27' && 'xcode-27' || 'macos-26' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Native fractional ALU probe
        shell: bash
        run: bash scripts/fract/run.sh
      - name: Observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fract-${{ inputs.runner_label }}
          retention-days: 7
          if-no-files-found: error
          path: |
            out-fract/inputs.bin
            out-fract/samples.bin
            out-fract/corpus.json
            out-fract/native.json
            out-fract/check.json
            out-fract/wrong-expected.json
            out-fract/toolchain.txt
            out-fract/fract.air
            out-fract/fract.metallib
            out-fract/SHA256SUMS
