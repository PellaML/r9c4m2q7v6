name: Generic attachment derivative observation
run-name: Generic attachment derivative bounded matrix
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: generic-attachment-derivative-matrix
  cancel-in-progress: false
jobs:
  observe:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/quad-fetch/host.rs
            /scripts/quad-fetch/bridge.m
            /scripts/quad-fetch/probe.metal
            /scripts/quad-fetch/run.sh
            /.github/workflows/quad-fetch.yml
      - name: Bounded native observations and explicit controls
        shell: bash
        env:
          QUAD_RUNNER_LABEL: ${{ matrix.runner }}
        run: bash scripts/quad-fetch/run.sh out-quad-fetch
      - name: Audit output allowlist and budget
        if: always()
        id: bounds
        shell: bash
        run: |
          set -euo pipefail
          [[ -d out-quad-fetch/logs && -d out-quad-fetch/evidence ]]
          cd out-quad-fetch
          [[ -z "$(find logs evidence -type l -print)" ]] || exit 1
          count=0
          total=0
          while IFS= read -r file; do
            [[ -f "$file" && ! -L "$file" ]] || exit 1
            case "$file" in
              logs/*.log|logs/command-exit.json|logs/seal-failure.txt|evidence/source-sha256.txt|evidence/SHA256SUMS|\
              evidence/native/inputs/*.bin|evidence/native/inputs/coverage.csv|evidence/native/inputs/contract.json|\
              evidence/native/cases/*/native.json|evidence/native/cases/*/evidence.bin|evidence/native/cases/*/ffi-exit.txt|\
              evidence/native/cases/*/*.u16.bin|evidence/native/cases/*/trace.u32.bin|\
              evidence/native/controls/*/native.json|evidence/native/controls/*/evidence.bin|evidence/native/controls/*/ffi-exit.txt|\
              evidence/native/controls/*/*.u16.bin|evidence/native/controls/*/trace.u32.bin|\
              evidence/native/summary.json|evidence/native/case-summary.csv|evidence/native/helper-observations.csv) ;;
              *) echo 'Unexpected artifact path.' >&2; exit 1 ;;
            esac
            size=$(wc -c < "$file")
            (( size <= 4194304 )) || exit 1
            total=$((total + size))
            count=$((count + 1))
          done < <(find logs evidence -type f -print | LC_ALL=C sort)
          (( count > 0 && count <= 3072 && total <= 33554432 )) || exit 1
          printf 'bounded files=%s bytes=%s\n' "$count" "$total"
          echo 'bounded=true' >> "$GITHUB_OUTPUT"
      - name: Retain exact generic results or failure
        if: ${{ always() && steps.bounds.outputs.bounded == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: quad-fetch-${{ matrix.runner }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: |
            out-quad-fetch/logs/
            out-quad-fetch/evidence/
