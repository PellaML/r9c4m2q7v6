name: Generic atan2 log2 cohort
run-name: Generic atan2 log2 cohort (two native images, one head)

on:
  push:
    branches: [research/atan2-log2-cohort]
    paths:
      - .github/workflows/atan2-log2.yml
      - probes/atan2-log2/**

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            os_major: '26'
          - runner: xcode-27
            os_major: '27'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    env:
      EXPECTED_OS_MAJOR: ${{ matrix.os_major }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Batched native atan2/log2 readback
        shell: bash
        run: bash probes/atan2-log2/run.sh
      - name: Raw observations and controls
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atan2-log2-${{ matrix.runner }}
          retention-days: 7
          if-no-files-found: error
          path: |
            out-atan2-log2/*.json
            out-atan2-log2/*.bin
            out-atan2-log2/*.air
            out-atan2-log2/*.metallib
            out-atan2-log2/*.ll
            out-atan2-log2/toolchain.txt
            out-atan2-log2/SHA256SUMS