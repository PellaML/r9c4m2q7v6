name: Generic RG16Float ADD observation
run-name: RG16Float native replacement and ADD bit observations
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: generic-rg16add-observation
  cancel-in-progress: false
jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == '1'
    strategy:
      fail-fast: false
      matrix:
        label: [macos-26, xcode-27]
    runs-on: ${{ matrix.label }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Capture and validate
        id: observe
        shell: bash
        run: |
          [[ ! -e out-rg16add && ! -L out-rg16add ]] || exit 1
          echo 'fresh=true' >> "$GITHUB_OUTPUT"
          bash scripts/rg16add/run.sh
      - name: Enforce artifact budget
        if: ${{ always() && steps.observe.outputs.fresh == 'true' }}
        id: bounds
        shell: bash
        run: |
          shopt -s nullglob
          [[ -d out-rg16add/results && ! -L out-rg16add && ! -L out-rg16add/results ]] || exit 1
          [[ -z "$(find out-rg16add ! -type f ! -type d -print -quit)" ]] || exit 1
          [[ -z "$(find out-rg16add -mindepth 1 -type d ! -path out-rg16add/results -print -quit)" ]] || exit 1
          files=(out-rg16add/command-exit.json out-rg16add/run-receipt.txt out-rg16add/source-sha256.txt out-rg16add/sha256.txt
                 out-rg16add/results/*.json out-rg16add/results/*.bin out-rg16add/results/*.tsv out-rg16add/results/*.txt)
          total=0; count=0
          for file in "${files[@]}"; do
            [[ -f "$file" && ! -L "$file" ]] || exit 1
            size=$(wc -c < "$file"); (( size <= 1048576 )) || exit 1
            total=$((total + size)); count=$((count + 1))
          done
          actual=$(find out-rg16add -type f | wc -l)
          (( count == actual && count >= 6 && count <= 64 && total <= 4194304 )) || exit 1
          (cd out-rg16add && shasum -a 256 -c sha256.txt > /dev/null)
          echo 'bounded=true' >> "$GITHUB_OUTPUT"
      - name: Retain bounded observations
        if: ${{ always() && steps.bounds.outputs.bounded == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: rg16add-${{ matrix.label }}
          retention-days: 3
          if-no-files-found: error
          path: |
            out-rg16add/command-exit.json
            out-rg16add/run-receipt.txt
            out-rg16add/source-sha256.txt
            out-rg16add/sha256.txt
            out-rg16add/results/*.json
            out-rg16add/results/*.bin
            out-rg16add/results/*.tsv
            out-rg16add/results/*.txt
