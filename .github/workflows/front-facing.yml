name: Generic Metal front-facing observation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' && github.run_attempt == '1'
    strategy:
      fail-fast: false
      matrix:
        label: [macos-26, xcode-27]
    runs-on: ${{ matrix.label }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Native observation only
        id: observe
        shell: bash
        env:
          RUNNER_LABEL: ${{ matrix.label }}
        run: |
          [[ ! -e out-front-facing && ! -L out-front-facing ]] || exit 1
          echo 'fresh=true' >> "$GITHUB_OUTPUT"
          bash scripts/front-facing/run.sh
      - name: Bound and seal artifact files (never build executables)
        if: ${{ always() && steps.observe.outputs.fresh == 'true' }}
        id: bounds
        shell: bash
        run: |
          shopt -s nullglob
          files=(out-front-facing/*.json out-front-facing/*.txt out-front-facing/*.tsv
                 out-front-facing/results/*.json out-front-facing/results/*.tsv out-front-facing/results/*.bin)
          [[ -d out-front-facing && ! -L out-front-facing && ! -L out-front-facing/results ]] || exit 1
          total=0
          for f in "${files[@]}"; do
            [[ -f "$f" && ! -L "$f" ]] || exit 1
            n=$(wc -c < "$f"); (( n <= 1048576 )) || exit 1
            total=$((total + n))
          done
          (( ${#files[@]} >= 4 && ${#files[@]} <= 64 && total <= 4194304 )) || exit 1
          (cd out-front-facing && shasum -a 256 -c sha256.txt)
          echo 'bounded=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && steps.bounds.outputs.bounded == 'true' }}
        with:
          name: front-facing-${{ matrix.label }}
          retention-days: 3
          if-no-files-found: error
          path: |
            out-front-facing/*.json
            out-front-facing/*.txt
            out-front-facing/*.tsv
            out-front-facing/results/*.json
            out-front-facing/results/*.tsv
            out-front-facing/results/*.bin
