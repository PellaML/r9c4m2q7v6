name: Bounded signed16 vector conversion observations
on:
  workflow_dispatch:
    inputs:
      main_reviewed:
        description: Main reviewed these exact generic source files
        type: boolean
        required: true
        default: false
      reviewed_commit:
        description: Full reviewed commit SHA, equal to this run commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: bounded-signed16-observation
  cancel-in-progress: false
jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' && inputs.main_reviewed == true && inputs.reviewed_commit == github.sha && github.repository == 'PellaML/r9c4m2q7v6' && github.ref == 'refs/heads/research/probe' && github.run_attempt == '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-26
            os_build: 25G332
          - label: xcode-27
            os_build: 26A434
    runs-on: ${{ matrix.label }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Inspect exact AIR and observe precise plus fast in one job
        id: observe
        shell: bash
        env:
          RUNNER_LABEL: ${{ matrix.label }}
          EXPECTED_OS_BUILD: ${{ matrix.os_build }}
        run: |
          [[ ! -e out-signed16 && ! -L out-signed16 ]] || exit 1
          echo 'fresh=true' >> "$GITHUB_OUTPUT"
          python3 -B scripts/signed16/probe.py run
      - name: Verify bounded retained files
        id: bounds
        if: ${{ always() && steps.observe.outputs.fresh == 'true' }}
        shell: bash
        run: |
          python3 -B scripts/signed16/probe.py verify
          echo 'bounded=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && steps.bounds.outputs.bounded == 'true' }}
        with:
          name: signed16-${{ matrix.label }}-${{ matrix.os_build }}
          retention-days: 3
          if-no-files-found: error
          path: |
            out-signed16/metadata.json
            out-signed16/commands.json
            out-signed16/source-sha256.json
            out-signed16/run-status.json
            out-signed16/inputs.json
            out-signed16/float-input.bin
            out-signed16/inverse-input.bin
            out-signed16/domain-check.json
            out-signed16/self-test.txt
            out-signed16/toolchain.txt
            out-signed16/build.txt
            out-signed16/validation.json
            out-signed16/precise.air
            out-signed16/precise.ll
            out-signed16/precise.ir-proof.json
            out-signed16/precise.compile.json
            out-signed16/precise.metallib
            out-signed16/precise.gpu.json
            out-signed16/precise.gpu.bin
            out-signed16/precise.native.txt
            out-signed16/precise.observed.tsv
            out-signed16/fast.air
            out-signed16/fast.ll
            out-signed16/fast.ir-proof.json
            out-signed16/fast.compile.json
            out-signed16/fast.metallib
            out-signed16/fast.gpu.json
            out-signed16/fast.gpu.bin
            out-signed16/fast.native.txt
            out-signed16/fast.observed.tsv
            out-signed16/pins.json
            out-signed16/pins.sha256
