name: Bounded native method evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Collect and encrypt bounded evidence
        shell: bash
        run: bash scripts/native-methods/run.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-methods-encrypted
          retention-days: 3
          if-no-files-found: error
          path: out-native-methods/evidence.cms
