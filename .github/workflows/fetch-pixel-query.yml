name: Bounded pixel sampling and dimension observations
on:
  workflow_dispatch:
    inputs:
      expected_head:
        description: Exact reviewed source commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: bounded-pixel-query
  cancel-in-progress: false
jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'PellaML/r9c4m2q7v6' && github.ref == 'refs/heads/research/probe' && github.run_attempt == '1' && github.sha == inputs.expected_head
    runs-on: macos-26
    timeout-minutes: 12
    env:
      EXPECTED_HEAD: ${{ inputs.expected_head }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: One finite native batch
        timeout-minutes: 7
        shell: bash
        run: bash scripts/pixel-query/run.sh out-pixel-query
      - name: Bound and seal only generic result files
        if: always()
        id: bounds
        shell: bash
        run: |
          bash scripts/pixel-query/run.sh --check-artifacts out-pixel-query
          echo 'bounded=true' >> "$GITHUB_OUTPUT"
      - name: Retain bounded observations including partial failures
        if: ${{ always() && steps.bounds.outputs.bounded == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: pixel-query-observations
          retention-days: 3
          if-no-files-found: error
          path: out-pixel-query/results/
