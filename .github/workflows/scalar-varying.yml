name: Bounded scalar and linked f32 observations
on:
  workflow_dispatch:
    inputs:
      main_reviewed:
        description: Main reviewed exactly this generic source subset
        type: boolean
        required: true
        default: false
      reviewed_commit:
        description: Full reviewed commit SHA, equal to the run commit
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: bounded-scalar-varying
  cancel-in-progress: false
jobs:
  observe:
    if: github.event_name == 'workflow_dispatch' && inputs.main_reviewed == true && inputs.reviewed_commit == github.sha && github.repository == 'PellaML/r9c4m2q7v6' && github.ref == 'refs/heads/research/probe' && github.run_attempt == '1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macos-26
            build: 25G332
          - label: xcode-27
            build: 26A434
    runs-on: ${{ matrix.label }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Inspect exact AIR, then run two bounded command buffers
        id: observe
        env:
          RUNNER_LABEL: ${{ matrix.label }}
          EXPECTED_OS_BUILD: ${{ matrix.build }}
        run: |
          [[ ! -e out-scalar-varying && ! -L out-scalar-varying ]] || exit 1
          echo 'fresh=true' >> "$GITHUB_OUTPUT"
          bash scripts/scalar-varying/run.sh
      - name: Verify exact artifact allowlist, hashes and size bounds
        id: bounds
        if: ${{ always() && steps.observe.outputs.fresh == 'true' }}
        run: |
          bash scripts/scalar-varying/run.sh verify
          echo 'bounded=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ always() && steps.bounds.outputs.bounded == 'true' }}
        with:
          name: scalar-varying-${{ matrix.label }}-${{ matrix.build }}
          retention-days: 3
          if-no-files-found: error
          path: |
            out-scalar-varying/sha256.txt
            out-scalar-varying/results/
