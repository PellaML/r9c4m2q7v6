name: Packed UNORM ALU probe
run-name: Packed UNORM ALU (${{ inputs.runner_label }}, ${{ inputs.math_mode }})

on:
  workflow_dispatch:
    inputs:
      runner_label:
        description: Standard Apple Silicon runner image
        type: choice
        required: true
        default: macos-26
        options:
          - macos-26
          - xcode-27
      math_mode:
        description: Compiler math permission
        type: choice
        required: true
        default: strict
        options:
          - strict
          - fast

permissions:
  contents: read

jobs:
  unpack:
    runs-on: ${{ inputs.runner_label == 'xcode-27' && 'xcode-27' || 'macos-26' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Native ALU probe
        shell: bash
        env:
          PROBE_MATH_MODE: ${{ inputs.math_mode }}
        run: bash scripts/unpack/run.sh "$PROBE_MATH_MODE"
      - name: Observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unpack-${{ inputs.runner_label }}
          retention-days: 7
          if-no-files-found: error
          path: |
            out-unpack/manifest.json
            out-unpack/native.json
            out-unpack/check.json
            out-unpack/wrong-expected.json
            out-unpack/inputs.bin
            out-unpack/expected-half.bin
            out-unpack/samples.bin
            out-unpack/toolchain.txt
            out-unpack/unpack.air
            out-unpack/unpack.metallib
            out-unpack/SHA256SUMS
